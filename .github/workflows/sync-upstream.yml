# Keeps this fork's main in step with storytold/effectcraft.
# Lives only in the fork, at a path upstream never uses, so merges stay conflict-free.
name: Sync from upstream

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'storytold/effectcraft'
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream main into fork main
        env:
          # GITHUB_TOKEN cannot push commits that change .github/workflows/*.
          # Upstream edits its workflows now and then, so add a fine-grained PAT
          # (this repo only: Contents + Workflows read/write) as secret SYNC_TOKEN.
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          result=$(gh api -X POST "repos/$REPO/merge-upstream" -f branch=main)
          echo "$result"
          echo "### Upstream sync" >> "$GITHUB_STEP_SUMMARY"
          echo "$result" >> "$GITHUB_STEP_SUMMARY"
